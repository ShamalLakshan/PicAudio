name: Portable Build - Linux AppImage

on:
  workflow_dispatch:

jobs:
  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04

    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev \
            libtag1-dev \
            libgtest-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            patchelf \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libswresample-dev \
            libavutil-dev \
            libarchive-dev \
            zsync \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-multimedia-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland \
            qt6-wayland-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs \
            qml6-module-qt-labs-platform \
            qml6-module-qtcore \
            libpulse-dev \
            libasound2-dev \
            file \
            curl \
            zlib1g-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Compile and install GoogleTest
        run: |
          sudo cmake -B /tmp/gtest-build -S /usr/src/googletest
          sudo cmake --build /tmp/gtest-build --parallel
          sudo cmake --install /tmp/gtest-build

      - name: Build unit tests and run verification
        run: |
          cmake -B build-test -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-test --parallel
          ctest --test-dir build-test --output-on-failure

      - name: Package AppImage
        run: |
          chmod +x deploy/linux/build-appimage.sh
          ./deploy/linux/build-appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-Linux-x86_64-AppImage
          path: |
            dist/PicAudio-*.AppImage
            dist/PicAudio-*.AppImage.zsync
            dist/PicAudio-*.AppImage.sha256
          if-no-files-found: error
