name: Portable Builds (Smoke Testing)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Linux AppImage Build
  # ==========================================
  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsqlite3-dev \
            libtag1-dev \
            libgtest-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-multimedia-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            libpulse-dev \
            libasound2-dev \
            file \
            curl \
            zlib1g-dev

      - name: Build unit tests and run verification
        run: |
          cmake -B build-test -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test -j$(nproc)
          ctest --test-dir build-test --output-on-failure

      - name: Package AppImage
        run: |
          chmod +x deploy/linux/build-appimage.sh
          ./deploy/linux/build-appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-Linux-x86_64-AppImage
          path: dist/PicAudio-x86_64.AppImage
          if-no-files-found: error

  # ==========================================
  # Windows Portable ZIP Build
  # ==========================================
  windows-portable:
    name: Windows Portable (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Install vcpkg dependencies (TagLib, SQLite3)
        run: |
          vcpkg install sqlite3:x64-windows taglib:x64-windows

      - name: Configure and build
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release -j$env:NUMBER_OF_PROCESSORS

      - name: Package Windows portable bundle
        shell: pwsh
        run: |
          deploy/windows/package-portable.ps1 -BuildDir "build" -OutputDir "dist" -Arch "x64"

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-Windows-x64-Portable
          path: dist/PicAudio-windows-x64-portable.zip
          if-no-files-found: error

  # ==========================================
  # macOS Portable Bundle Build
  # ==========================================
  macos-portable:
    name: macOS Portable (Universal)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install qt@6 taglib sqlite ninja

      - name: Configure and build
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6):$(brew --prefix taglib)"
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build

      - name: Package macOS portable bundle
        run: |
          chmod +x deploy/macos/package-portable.sh
          ./deploy/macos/package-portable.sh build dist

      - name: Upload macOS Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-macOS-Universal-Portable
          path: dist/PicAudio-macos-universal-portable.zip
          if-no-files-found: error
