name: Portable Builds (Release Packages)

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # Linux AppImage Build
  # ==========================================
  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev \
            libtag1-dev \
            libgtest-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-multimedia-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland \
            qt6-wayland-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qt-labs-platform \
            qml6-module-qtcore \
            libpulse-dev \
            libasound2-dev \
            file \
            curl \
            zlib1g-dev

      - name: Build unit tests and run verification
        run: |
          cmake -B build-test -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-test -j$(nproc)
          ctest --test-dir build-test --output-on-failure

      - name: Package AppImage
        run: |
          chmod +x deploy/linux/build-appimage.sh
          ./deploy/linux/build-appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-Linux-x86_64-AppImage
          path: dist/PicAudio-x86_64.AppImage
          if-no-files-found: error

  # ==========================================
  # Windows Portable Bundle & EXE Build
  # ==========================================
  windows-portable:
    name: Windows Portable (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Install vcpkg dependencies (TagLib, SQLite3)
        run: |
          vcpkg install sqlite3:x64-windows taglib:x64-windows

      - name: Configure and build
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTING=OFF
          cmake --build build --config Release -j$env:NUMBER_OF_PROCESSORS

      - name: Package Windows portable bundle
        shell: pwsh
        run: |
          deploy/windows/package-portable.ps1 -BuildDir "build" -OutputDir "dist" -Arch "x64"

      - name: Upload Windows Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicAudio-Windows-x64-Portable
          path: dist/PicAudio-windows-x64-portable.*
          if-no-files-found: error
